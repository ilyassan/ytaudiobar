name: Release

on:
    push:
        tags:
            - 'v*.*.*'

jobs:
    create-release:
        permissions:
            contents: write
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-22.04
                      platform: linux
                      rust_targets: ''
                    - os: windows-latest
                      platform: windows
                      rust_targets: ''
                    - os: macos-latest
                      platform: macos
                      # Universal binary (both architectures in one artifact) --
                      # matches how the native Swift version already ships.
                      rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 20

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.rust_targets }}

            - name: Cache Rust build artifacts
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri
                  # Universal-target macOS builds resolve a different dependency
                  # set than the plain host-target Windows/Linux builds -- keyed
                  # per-platform already via the cache action's default job-key
                  # inclusion, but rust_targets makes that split explicit here too.
                  key: ${{ matrix.platform }}-${{ matrix.rust_targets }}

            - name: Install dependencies (Ubuntu only)
              if: matrix.platform == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

            - name: Install frontend dependencies
              run: npm install

            - name: Get version from tag
              id: get_version
              shell: bash
              run: |
                  VERSION=${GITHUB_REF#refs/tags/v}
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
                  if [[ "$VERSION" == *"-"* ]]; then
                    echo "is_prerelease=true" >> $GITHUB_OUTPUT
                  else
                    echo "is_prerelease=false" >> $GITHUB_OUTPUT
                  fi

            - name: Verify signing secrets exist
              shell: bash
              run: |
                  if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
                    echo "❌ ERROR: TAURI_SIGNING_PRIVATE_KEY secret is not set!"
                    exit 1
                  else
                    echo "✅ TAURI_SIGNING_PRIVATE_KEY secret exists (length: ${#TAURI_SIGNING_PRIVATE_KEY})"
                  fi

                  if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]; then
                    echo "❌ ERROR: TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret is not set!"
                    exit 1
                  else
                    echo "✅ TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret exists"
                  fi
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

            - name: Import Apple certificate into keychain (macOS)
              if: matrix.platform == 'macos'
              env:
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
              run: |
                  KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
                  KEYCHAIN_PASSWORD=$(openssl rand -base64 12)

                  security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

                  echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
                  security import "$RUNNER_TEMP/certificate.p12" \
                    -k "$KEYCHAIN_PATH" \
                    -P "$APPLE_CERTIFICATE_PASSWORD" \
                    -T /usr/bin/codesign \
                    -T /usr/bin/security
                  rm "$RUNNER_TEMP/certificate.p12"

                  security list-keychain -d user -s "$KEYCHAIN_PATH"
                  security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security find-identity -v -p codesigning "$KEYCHAIN_PATH"

                  echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
                  echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

            - name: Write Apple API key for notarization (macOS)
              if: matrix.platform == 'macos'
              env:
                  APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
                  APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
              run: |
                  API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
                  printf '%s' "$APPLE_API_KEY_P8" > "$API_KEY_PATH"
                  echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> $GITHUB_ENV

            - name: Build app
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  # Tauri's dmg bundler auto-appends --skip-jenkins to its bundle_dmg.sh
                  # call whenever CI=true (which GitHub Actions sets by default),
                  # silently skipping the AppleScript step that applies the configured
                  # background/icon positions to the volume -- it prints an info line,
                  # not an error, so every dmg we'd built in CI had none of that styling
                  # even though the build reported success (confirmed by inspecting a
                  # released dmg: background image was copied in, but no .DS_Store was
                  # ever written, so Finder had nothing to apply it with). This is
                  # Tauri's own documented escape hatch for it -- see tauri-apps/tauri#592
                  # and tauri-apps/tauri-action#740.
                  TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
                  # macOS code signing — env vars are read by Tauri automatically.
                  # On Linux/Windows runners these are empty and ignored.
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
                  APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
                  APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
              # Pre-release builds use tauri.beta.conf.json which overrides the
              # updater endpoint to latest-beta.json so beta installs check the
              # beta channel, leaving stable users' latest.json untouched.
              run: npm run tauri build -- ${{ matrix.platform == 'windows' && '--bundles nsis' || matrix.platform == 'macos' && '--target universal-apple-darwin' || '' }} ${{ steps.get_version.outputs.is_prerelease == 'true' && '--config src-tauri/tauri.beta.conf.json' || '' }}

            # SSL.com eSigner — signs the Windows installer with your OV cert so
            # Windows shows your publisher name instead of "Unknown Publisher".
            # Skipped automatically when secrets aren't set (existing releases
            # continue working while the cert is being obtained).
            # Requires 4 GitHub secrets — see setup instructions below:
            #   SSL_COM_USERNAME      → your SSL.com account email
            #   SSL_COM_PASSWORD      → your SSL.com account password
            #   SSL_COM_CREDENTIAL_ID → certificate ID from SSL.com dashboard
            #   SSL_COM_TOTP_SECRET   → base32 TOTP secret from SSL.com eSigner 2FA setup
            - name: Check SSL.com eSigner secrets availability
              if: matrix.platform == 'windows'
              id: ssl_check
              shell: bash
              run: |
                  if [ -n "$SSL_COM_USERNAME" ] && [ -n "$SSL_COM_CREDENTIAL_ID" ]; then
                    echo "available=true" >> $GITHUB_OUTPUT
                    echo "✅ SSL.com eSigner secrets found — will sign installer"
                  else
                    echo "available=false" >> $GITHUB_OUTPUT
                    echo "⚠️  SSL.com eSigner secrets not set — skipping Windows signing"
                  fi
              env:
                  SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
                  SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}

            - name: Sign Windows installer with SSL.com eSigner
              if: matrix.platform == 'windows' && steps.ssl_check.outputs.available == 'true'
              uses: sslcom/esigner-codesign@develop
              with:
                  command: sign
                  username: ${{ secrets.SSL_COM_USERNAME }}
                  password: ${{ secrets.SSL_COM_PASSWORD }}
                  credential_id: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
                  totp_secret: ${{ secrets.SSL_COM_TOTP_SECRET }}
                  # Sign the .exe before zipping — so the updater zip in the next
                  # step wraps an already-signed binary.
                  file_path: ${{ github.workspace }}\src-tauri\target\release\bundle\nsis\YTAudioBar_${{ steps.get_version.outputs.version }}_x64-setup.exe
                  malware_block: false
                  clean_log: false
                  environment_name: PROD

            - name: Create signed updater archives (Windows)
              if: matrix.platform == 'windows'
              shell: pwsh
              run: |
                  # Write private key to temp file
                  $keyFile = New-TemporaryFile
                  "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | Out-File -FilePath $keyFile -Encoding utf8 -NoNewline

                  cd src-tauri/target/release/bundle/nsis
                  Get-ChildItem *.exe | ForEach-Object {
                    $exe = $_.Name
                    $zip = "$exe.zip"
                    Write-Host "Creating $zip with no compression"
                    & "C:\Program Files\7-Zip\7z.exe" a -tzip -mx=0 $zip $exe
                    Write-Host "Signing $zip"
                    npx @tauri-apps/cli signer sign $zip --private-key-path $keyFile --password "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
                  }

                  # Clean up key file
                  Remove-Item $keyFile -Force
                  Get-ChildItem

            - name: Create signed updater archives (Linux)
              if: matrix.platform == 'linux'
              shell: bash
              run: |
                  # Write private key to temp file
                  KEY_FILE=$(mktemp)
                  echo -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" > "$KEY_FILE"

                  cd src-tauri/target/release/bundle/appimage
                  for appimage in *.AppImage; do
                    echo "Creating ${appimage}.tar.gz"
                    tar czf "${appimage}.tar.gz" "$appimage"
                    echo "Signing ${appimage}.tar.gz"
                    npx @tauri-apps/cli signer sign "${appimage}.tar.gz" --private-key-path "$KEY_FILE" --password "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
                  done

                  # Clean up key file
                  rm -f "$KEY_FILE"
                  ls -la

            - name: Create signed updater archive (macOS)
              if: matrix.platform == 'macos'
              shell: bash
              run: |
                  # Write private key to temp file
                  KEY_FILE=$(mktemp)
                  echo -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" > "$KEY_FILE"

                  cd src-tauri/target/universal-apple-darwin/release/bundle/macos
                  for app in *.app; do
                    echo "Creating ${app}.tar.gz"
                    tar czf "${app}.tar.gz" "$app"
                    echo "Signing ${app}.tar.gz"
                    npx @tauri-apps/cli signer sign "${app}.tar.gz" --private-key-path "$KEY_FILE" --password "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
                  done

                  # Clean up key file
                  rm -f "$KEY_FILE"
                  ls -la

            - name: Clean up signing artifacts (macOS)
              if: matrix.platform == 'macos' && always()
              run: |
                  security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
                  rm -f "$APPLE_API_KEY_PATH" 2>/dev/null || true

            - name: Upload Release Assets (Windows)
              if: matrix.platform == 'windows'
              uses: softprops/action-gh-release@v3
              with:
                  prerelease: ${{ steps.get_version.outputs.is_prerelease == 'true' }}
                  files: |
                      src-tauri/target/release/bundle/nsis/*.exe
                      src-tauri/target/release/bundle/nsis/*.exe.zip
                      src-tauri/target/release/bundle/nsis/*.exe.zip.sig
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload Release Assets (Linux)
              if: matrix.platform == 'linux'
              uses: softprops/action-gh-release@v3
              with:
                  prerelease: ${{ steps.get_version.outputs.is_prerelease == 'true' }}
                  files: |
                      src-tauri/target/release/bundle/appimage/*.AppImage
                      src-tauri/target/release/bundle/appimage/*.tar.gz
                      src-tauri/target/release/bundle/appimage/*.tar.gz.sig
                      src-tauri/target/release/bundle/deb/*.deb
                      src-tauri/target/release/bundle/rpm/*.rpm
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload Release Assets (macOS)
              if: matrix.platform == 'macos'
              uses: softprops/action-gh-release@v3
              with:
                  prerelease: ${{ steps.get_version.outputs.is_prerelease == 'true' }}
                  files: |
                      src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
                      src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
                      src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    generate-update-manifest:
        needs: create-release
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Generate latest.json
              if: ${{ !contains(github.ref, '-') }}
              run: |
                  set -euo pipefail
                  VERSION="${GITHUB_REF#refs/tags/v}"
                  TAG="${GITHUB_REF#refs/tags/}"

                  # Download signature files from the release.
                  #
                  # -f matters: without it curl exits 0 on a 404/5xx and the
                  # error body ("Not Found", or an HTML page) becomes the
                  # signature. That publishes a latest.json every client then
                  # rejects, and since it's only regenerated on the next tag,
                  # the release stays permanently un-updatable.
                  fetch_sig() {
                    local url="$1"
                    local sig
                    sig=$(curl -fsSL "$url") || {
                      echo "::error::Failed to download signature: $url"
                      exit 1
                    }
                    if [ -z "$sig" ]; then
                      echo "::error::Signature is empty: $url"
                      exit 1
                    fi
                    printf '%s' "$sig"
                  }

                  WIN_SIG=$(fetch_sig "https://github.com/ilyassan/ytaudiobar/releases/download/${TAG}/YTAudioBar_${VERSION}_x64-setup.exe.zip.sig")
                  LINUX_SIG=$(fetch_sig "https://github.com/ilyassan/ytaudiobar/releases/download/${TAG}/YTAudioBar_${VERSION}_amd64.AppImage.tar.gz.sig")
                  MACOS_SIG=$(fetch_sig "https://github.com/ilyassan/ytaudiobar/releases/download/${TAG}/YTAudioBar.app.tar.gz.sig")

                  cat > latest.json << EOF
                  {
                    "version": "$VERSION",
                    "notes": "Update available",
                    "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                    "platforms": {
                      "windows-x86_64": {
                        "signature": "$WIN_SIG",
                        "url": "https://github.com/ilyassan/ytaudiobar/releases/download/${GITHUB_REF#refs/tags/}/YTAudioBar_${VERSION}_x64-setup.exe.zip"
                      },
                      "linux-x86_64": {
                        "signature": "$LINUX_SIG",
                        "url": "https://github.com/ilyassan/ytaudiobar/releases/download/${GITHUB_REF#refs/tags/}/YTAudioBar_${VERSION}_amd64.AppImage.tar.gz"
                      },
                      "darwin-aarch64": {
                        "signature": "$MACOS_SIG",
                        "url": "https://github.com/ilyassan/ytaudiobar/releases/download/${GITHUB_REF#refs/tags/}/YTAudioBar.app.tar.gz"
                      },
                      "darwin-x86_64": {
                        "signature": "$MACOS_SIG",
                        "url": "https://github.com/ilyassan/ytaudiobar/releases/download/${GITHUB_REF#refs/tags/}/YTAudioBar.app.tar.gz"
                      }
                    }
                  }
                  EOF

                  # Fail loudly rather than shipping a manifest clients can't parse.
                  jq empty latest.json
                  cat latest.json

            - name: Upload latest.json to Release
              if: ${{ !contains(github.ref, '-') }}
              uses: softprops/action-gh-release@v3
              with:
                  files: latest.json
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    generate-beta-manifest:
        needs: create-release
        runs-on: ubuntu-latest
        permissions:
            contents: write
        if: contains(github.ref, '-')

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Generate latest-beta.json
              run: |
                  set -euo pipefail
                  VERSION="${GITHUB_REF#refs/tags/v}"
                  TAG="${GITHUB_REF#refs/tags/}"

                  fetch_sig() {
                    local url="$1"
                    local sig
                    sig=$(curl -fsSL "$url") || {
                      echo "::error::Failed to download signature: $url"
                      exit 1
                    }
                    if [ -z "$sig" ]; then
                      echo "::error::Signature is empty: $url"
                      exit 1
                    fi
                    printf '%s' "$sig"
                  }

                  WIN_SIG=$(fetch_sig "https://github.com/ilyassan/ytaudiobar/releases/download/${TAG}/YTAudioBar_${VERSION}_x64-setup.exe.zip.sig")
                  LINUX_SIG=$(fetch_sig "https://github.com/ilyassan/ytaudiobar/releases/download/${TAG}/YTAudioBar_${VERSION}_amd64.AppImage.tar.gz.sig")
                  MACOS_SIG=$(fetch_sig "https://github.com/ilyassan/ytaudiobar/releases/download/${TAG}/YTAudioBar.app.tar.gz.sig")

                  cat > latest-beta.json << EOF
                  {
                    "version": "$VERSION",
                    "notes": "Beta update available",
                    "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                    "platforms": {
                      "windows-x86_64": {
                        "signature": "$WIN_SIG",
                        "url": "https://github.com/ilyassan/ytaudiobar/releases/download/${TAG}/YTAudioBar_${VERSION}_x64-setup.exe.zip"
                      },
                      "linux-x86_64": {
                        "signature": "$LINUX_SIG",
                        "url": "https://github.com/ilyassan/ytaudiobar/releases/download/${TAG}/YTAudioBar_${VERSION}_amd64.AppImage.tar.gz"
                      },
                      "darwin-aarch64": {
                        "signature": "$MACOS_SIG",
                        "url": "https://github.com/ilyassan/ytaudiobar/releases/download/${TAG}/YTAudioBar.app.tar.gz"
                      },
                      "darwin-x86_64": {
                        "signature": "$MACOS_SIG",
                        "url": "https://github.com/ilyassan/ytaudiobar/releases/download/${TAG}/YTAudioBar.app.tar.gz"
                      }
                    }
                  }
                  EOF

                  jq empty latest-beta.json
                  cat latest-beta.json

            - name: Upload latest-beta.json to this beta release
              uses: softprops/action-gh-release@v3
              with:
                  files: latest-beta.json
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Push latest-beta.json to beta-channel release
              run: |
                  # Create the beta-channel release if it doesn't exist yet.
                  # This is a permanent "container" release — its sole purpose is
                  # to host the latest-beta.json at a fixed, predictable URL so
                  # beta builds can always find the newest manifest regardless of
                  # which specific tag it came from.
                  gh release create beta-channel \
                    --prerelease \
                    --title "Beta Channel" \
                    --notes "Auto-maintained by CI. Holds the latest-beta.json manifest for the beta update channel. Do not install binaries from here directly — use a versioned beta release instead." \
                    2>/dev/null || true
                  gh release upload beta-channel latest-beta.json --clobber
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    aur-publish:
        needs: create-release
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Publish to AUR
              uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
              with:
                  pkgname: ytaudiobar-git
                  pkgbuild: ./PKGBUILD
                  commit_username: ${{ secrets.AUR_USERNAME }}
                  commit_email: ${{ secrets.AUR_USERNAME }}@aur.archlinux.org
                  ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
                  commit_message: 'Update to ${{ github.ref_name }}'
                  updpkgsums: false
