[package]
name = "ytaudiobar"
version = "2.5.0-beta.9"
description = "YouTube Audio Player for Windows, macOS, and Linux"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
rodio = { version = "0.19", default-features = false }
dirs = "5.0"
uuid = { version = "1.11", features = ["v4"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
rand = "0.8"
tauri-plugin-shell = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
souvlaki = "0.7"
raw-window-handle = "0.6"
zip = "2.1"
futures-util = "0.3"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
cpal = "0.15"
# Verifying dependency downloads against the checksums their publishers ship
# (see downloader::sha256_matches). Both were already in the tree transitively.
sha2 = "0.10"
hex = "0.4"

# Same version/features Tauri itself depends on, so `WebviewWindow::gtk_window()`
# hands back a type from the *same* gtk crate instance rather than a duplicate
# copy that wouldn't unify. Used to satisfy GNOME's focus-stealing prevention --
# see `present_with_user_interaction_time` in main.rs.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
gdkx11 = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"


[dev-dependencies]
tempfile = "3.14"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
